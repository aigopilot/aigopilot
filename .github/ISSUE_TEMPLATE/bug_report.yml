name: Bug report
description: Something in AigoPilot does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. This issue is **public**: leave out passwords, tokens, licence details, pairing codes, private paths, conversations and customer data. For billing, your account or anything private, use https://aigopilot.com/support instead. For a security problem, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A few sentences are enough.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen?
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Your system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AigoPilot version
      description: And roughly when it last updated, if you know.
      placeholder: "0.1.0, updated 25 October"
  - type: dropdown
    id: tool
    attributes:
      label: Which AI tool was the session using?
      multiple: true
      options:
        - Claude Code
        - Codex
        - Grok
        - Not about a session
  - type: dropdown
    id: where
    attributes:
      label: Where was the session?
      options:
        - On this computer
        - On a remote computer through an agent
        - Not about a session
  - type: textarea
    id: more
    attributes:
      label: Screenshot or excerpt
      description: Only if it helps, and with private parts removed. No full transcripts or diagnostic archives.
