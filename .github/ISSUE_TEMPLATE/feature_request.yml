name: Feature request
description: Something AigoPilot should do, or do better.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check https://aigopilot.com/features and the existing issues first; it may be built or on its way. To talk an idea through before asking for it, start a discussion instead.
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: The task or the way you work, not the feature yet.
    validations:
      required: true
  - type: textarea
    id: hard
    attributes:
      label: What is hard about it now?
      description: And how you get around it today, if you do.
    validations:
      required: true
  - type: textarea
    id: wish
    attributes:
      label: What would help?
      description: A concrete example is worth a lot.
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Your system
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
